<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@400;600&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet">

<style>
/* Scheda finale dei caroselli «<pianeta> nelle 12 case»: invita a salvare e a inviare (segnali che Instagram premia). 1080x1350. */
:root{--bg1:#0E2226;--bg2:#050E10;--gold:#CDAE66;--gold2:#EAD6A0;--parch:#F2EEE3;--mute:#B4C3BF;--hi:#1C4348}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:var(--bg2);font-family:Spectral,Georgia,serif;color:var(--parch)}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,var(--hi) 0%,var(--bg1) 38%,var(--bg2) 100%)}
.frame{position:absolute;inset:28px;border:1.5px solid rgba(205,174,102,.8);pointer-events:none;z-index:5}
.port{position:absolute;left:50%;top:92px;transform:translateX(-50%);width:250px;height:308px;border-radius:125px 125px 8px 8px;border:2px solid var(--gold);box-shadow:0 0 60px rgba(0,0,0,.45)}
.port.sym{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.08),rgba(0,0,0,.25))}
.blocks{position:absolute;left:90px;right:90px;top:500px;display:flex;flex-direction:column;align-items:center;text-align:center}
.it{display:flex;flex-direction:column;align-items:center}
.ic{width:74px;height:74px;margin-bottom:18px}
h2{font-family:"Cormorant Garamond";font-weight:600;font-size:76px;line-height:1.02;color:var(--parch)}
p{font-family:"Cormorant Garamond";font-style:italic;font-weight:500;font-size:38px;line-height:1.25;color:var(--gold2);margin-top:14px;max-width:820px}
.orn{color:var(--gold);font-size:30px;letter-spacing:.6em;margin:46px 0 40px;padding-left:.6em}
.foot{position:absolute;left:0;right:0;bottom:60px;text-align:center;font-family:"Cormorant Garamond";font-weight:600;font-size:34px;letter-spacing:.06em;color:var(--gold2)}
.foot span{font-family:Spectral;font-weight:400;letter-spacing:0;font-size:25px;color:var(--parch);margin-inline-end:14px}
body.cjk h2,body.cjk p,body.hi h2,body.hi p{font-family:inherit;font-style:normal}
body.sc{font-family:"Noto Serif SC",serif}body.jp{font-family:"Noto Serif JP",serif}body.hi{font-family:"Noto Serif Devanagari",serif}
body.cjk h2,body.hi h2{font-size:64px;font-weight:600;line-height:1.25}
body.cjk p,body.hi p{font-size:32px;line-height:1.5}
body.cjk .foot span,body.hi .foot span{font-family:inherit}
body.sole{--bg1:#2E1A06;--bg2:#120A03;--gold:#D4A94A;--gold2:#F0D48E;--parch:#F7EBD2;--hi:#5A3A0E}

body.venere{--bg1:#2C1020;--bg2:#12060D;--gold:#DDA98C;--gold2:#F3D0BD;--parch:#FBEFE8;--hi:#5A2338}
body.marte{--bg1:#2E0C0F;--bg2:#140608;--gold:#C9A34E;--gold2:#E8CD8E;--parch:#F2E7CF;--hi:#4A1216}
body.giove{--bg1:#141C3A;--bg2:#070A18;--gold:#D4B35A;--gold2:#EED79A;--parch:#F2EFE6;--hi:#26346A}

body.urano{--bg1:#0C2230;--bg2:#040E14;--gold:#C9B26A;--gold2:#E8D8A2;--parch:#EEF5F6;--hi:#174156}
body.nettuno{--bg1:#06242A;--bg2:#020D10;--gold:#CDAF62;--gold2:#EAD49A;--parch:#EAF4F1;--hi:#0E434B}

body.rahu{--bg1:#1C1634;--bg2:#09070F;--gold:#CDB57A;--gold2:#EAD9A8;--parch:#F1EDF7;--hi:#33285C}
body.ketu{--bg1:#251B12;--bg2:#0C0805;--gold:#D0AE72;--gold2:#EDD5A6;--parch:#F5EADB;--hi:#46331F}

body.lilith{--bg1:#21122E;--bg2:#0B0610;--gold:#CDB07A;--gold2:#E9D6B0;--parch:#F3ECF6;--hi:#3D2258}
