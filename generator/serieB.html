<!doctype html><html lang="en"><head><meta charset="utf-8">
<!-- Serie B generalizzata: #<pianeta>-<casa>-<lingua>, es. #sole-3-en, #luna-12-hi, #mercurio-6-it, #venere-5-hi. Formato Instagram 1080x1350. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+Devanagari:wght@400;600&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
<script src="glyphs.js"></script><script src="serieB_i18n.js"></script><script>var TS={},TM={},TME={},TV={},TG={},TSA={},TU={},TN={},TP={};</script><script src="serieB_more.js"></script><script src="i18n_add/es.js"></script><script src="i18n_add/pt.js"></script><script src="i18n_add/fr.js"></script><script src="i18n_add/ru.js"></script><script src="i18n_add/zh.js"></script><script src="i18n_add/ja.js"></script><script src="i18n_add/hi_more.js"></script><script src="i18n_add/es_more.js"></script><script src="i18n_add/pt_more.js"></script><script src="i18n_add/fr_more.js"></script><script src="i18n_add/ru_more.js"></script><script src="i18n_add/zh_more.js"></script><script src="i18n_add/ja_more.js"></script>
<style>
:root{--bg1:#2E0C0F;--bg2:#140608;--glow:#4A1216;--rust:#B04A2E;--gold:#C9A34E;--gold2:#E8CD8E;--parch:#F2E7CF;--mute:#CDB9A8;--line:rgba(232,205,142,.17);--frame:rgba(201,163,78,.8)}
body.sole{--bg1:#2E1A06;--bg2:#120A03;--glow:#5A3A0E;--rust:#D0762A;--gold:#D4A94A;--gold2:#F0D48E;--parch:#F7EBD2;--mute:#D8C3A0;--line:rgba(240,212,142,.18);--frame:rgba(212,169,74,.8)}
body.mercurio{--bg1:#0E2226;--bg2:#050E10;--glow:#1C4348;--rust:#D08A3A;--gold:#CDAE66;--gold2:#EAD6A0;--parch:#F2EEE3;--mute:#B4C3BF;--line:rgba(234,214,160,.16);--frame:rgba(205,174,102,.78)}
body.venere{--bg1:#2C1020;--bg2:#12060D;--glow:#5A2338;--rust:#D9788E;--gold:#DDA98C;--gold2:#F3D0BD;--parch:#FBEFE8;--mute:#D9B7B2;--line:rgba(243,208,189,.16);--frame:rgba(221,169,140,.78)}
body.luna{--bg1:#0E1830;--bg2:#050910;--glow:#1F3158;--rust:#8FA9D6;--gold:#BFCBDE;--gold2:#E1E8F3;--parch:#F1F4F9;--mute:#A9B5C9;--line:rgba(225,232,243,.16);--frame:rgba(191,203,222,.75)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:var(--bg2);font-family:Spectral,Georgia,serif;color:var(--parch)}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;background:radial-gradient(120% 70% at 85% 0%,var(--glow) 0%,var(--bg1) 40%,var(--bg2) 100%)}
.frame{position:absolute;inset:30px;border:1.5px solid var(--frame);pointer-events:none}
.port{position:absolute;right:62px;top:62px;width:190px;height:236px;border-radius:95px 95px 6px 6px;border:2px solid var(--gold)}
.sole .port{box-shadow:0 0 34px rgba(244,190,90,.28)}.luna .port{box-shadow:0 0 34px rgba(200,215,240,.25)}
.port .m{position:absolute;width:84px;height:84px;left:-28px;bottom:-16px}
.mercurio .port{box-shadow:0 0 30px rgba(120,200,190,.18)}
.port.sym{display:flex;align-items:center;justify-content:center}
.venere .port.sym{background:radial-gradient(75% 65% at 50% 38%,#6A2A42 0%,#3A1224 55%,#14060C 100%);box-shadow:0 0 34px rgba(240,170,170,.28)}
.luna .port .m{filter:grayscale(1) brightness(1.15) contrast(1.05)}
.house{position:absolute;left:78px;top:74px;font-family:"Cormorant Garamond";font-weight:600;font-size:150px;line-height:1;color:var(--gold)}
.body{position:absolute;left:78px;right:78px;top:330px}
h1{font-family:"Cormorant Garamond";font-weight:600;font-size:72px;line-height:1.04;text-wrap:balance}
li,.gut,.cta{text-wrap:pretty}
.lead{font-family:"Cormorant Garamond";font-style:italic;font-size:34px;color:var(--gold2);margin-top:14px}
ol{list-style:none;counter-reset:n;margin-top:18px}
li{counter-increment:n;position:relative;padding:17px 0 17px 62px;font-size:31px;line-height:1.36;border-bottom:1px solid var(--line)}
li:before{content:counter(n);position:absolute;left:4px;top:10px;font-family:"Cormorant Garamond";font-weight:600;font-size:46px;color:var(--rust)}
.gut{font-size:29px;line-height:1.42;margin-top:26px}
.gut i{color:var(--gold2)}
.cta{margin-top:22px;font-size:27px;color:var(--mute)}
.foot{position:absolute;left:0;right:0;bottom:52px;text-align:center;font-family:"Cormorant Garamond";font-weight:600;font-size:34px;letter-spacing:.07em;color:var(--gold2)}
/* Hindi: Noto Serif Devanagari, niente corsivo */
body.hi .body,body.hi h1,body.hi .lead,body.hi .gut i{font-family:"Noto Serif Devanagari",serif;font-style:normal}
body.hi h1{font-size:62px;line-height:1.3;font-weight:600}
body.hi .lead{font-size:31px;margin-top:10px}
body.hi li{font-size:33px;line-height:1.5;padding:15px 0 15px 62px}
body.hi li:before{top:4px}
body.hi .gut{font-size:30px;line-height:1.55;margin-top:24px}body.hi .gut i{font-weight:600}
body.hi .cta{font-size:27px}
/* Cinese e giapponese: Noto Serif SC/JP, niente corsivo */
body.zh .body,body.zh h1,body.zh .lead,body.zh .gut i,body.zh .cta{font-family:"Noto Serif SC",serif;font-style:normal}
body.ja .body,body.ja h1,body.ja .lead,body.ja .gut i,body.ja .cta{font-family:"Noto Serif JP",serif;font-style:normal}
body.zh h1,body.ja h1{font-size:60px;line-height:1.3;font-weight:700}
body.zh .lead,body.ja .lead{font-size:30px;margin-top:10px}
body.zh li,body.ja li{font-size:32px;line-height:1.55}
body.zh .gut i,body.ja .gut i{font-weight:600}
body.giove{--bg1:#141C3A;--bg2:#070A18;--glow:#26346A;--rust:#7FA0E8;--gold:#D4B35A;--gold2:#EED79A;--parch:#F2EFE6;--mute:#B9BFD6;--line:rgba(234,214,160,.16);--frame:rgba(201,170,100,.78)}
body.saturno{--bg1:#1A1A1E;--bg2:#08080A;--glow:#34343C;--rust:#B8A06A;--gold:#C9AE6A;--gold2:#E6D3A0;--parch:#EEEAE0;--mute:#B5B0A6;--line:rgba(234,214,160,.16);--frame:rgba(201,170,100,.78)}
body.urano{--bg1:#0C2230;--bg2:#040E14;--glow:#174A5E;--rust:#5FC8D8;--gold:#C9B26A;--gold2:#E8D8A2;--parch:#EEF5F6;--mute:#A9C3C9;--line:rgba(234,214,160,.16);--frame:rgba(201,170,100,.78)}
body.nettuno{--bg1:#06242A;--bg2:#020D10;--glow:#0E4A50;--rust:#4FB8A8;--gold:#CDAF62;--gold2:#EAD49A;--parch:#EAF4F1;--mute:#9EC2BC;--line:rgba(234,214,160,.16);--frame:rgba(201,170,100,.78)}
body.plutone{--bg1:#200A10;--bg2:#0A0306;--glow:#43121E;--rust:#B0384A;--gold:#C9A34E;--gold2:#E8CD8E;--parch:#F2E7DD;--mute:#C9B0AA;--line:rgba(234,214,160,.16);--frame:rgba(201,170,100,.78)}
</style></head><body><div id="root"></div>
<script>
const [PL,HS,L]=(location.hash.slice(1)||'sole-1-en').split('-'); const N=+HS;
const IMGS={sole:['/home/claude/dei/SOLE_PAE.png','30% 31%/180% auto'],luna:['/home/claude/dei/LUNAPIENA_PAE.png','44% 9%/300% auto'],
 mercurio:['/home/claude/dei/MERCURIO.png','46% 1%/250% auto'],marte:['/home/claude/dei/MARTE.png','42% 3%/215% auto'],giove:['/home/claude/dei/giove.png','50% 24%/270% auto'],saturno:['/home/claude/dei/saturno.png','50% 15%/270% auto'],urano:['/home/claude/dei/urano.png','50% 27%/270% auto'],nettuno:['/home/claude/dei/nettuno.png','48% 15%/270% auto'],plutone:['/home/claude/dei/plutone.png','52% 13%/270% auto']};
// Venere: venere.png ha una cornice ovale dipinta, quindi ritratto solo simbolo (come Lilith), oro rosa.
const SYM={venere:{g:'venere',c:'#F6D2BE',glow:'#E89AA8'}};
const Q=new URLSearchParams(location.search); const img=Q.get('img')||(IMGS[PL]||[])[0], pos=Q.get('pos')||(IMGS[PL]||[])[1];
const R=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'], U=SB_UI[L], [S,G]=SB[PL][L][N-1];
document.documentElement.lang=L; document.body.classList.add(PL,L);
document.getElementById('root').innerHTML=`<div class="s">
<div class="house blk">${R[N-1]}</div>${SYM[PL]?`<div class="port sym blk"><svg viewBox="0 0 100 100" width="78%" height="78%" fill="none" stroke="${SYM[PL].c}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 12px ${SYM[PL].glow})">${GLYPH[SYM[PL].g]}</svg></div>`:`<div class="port blk" style="background:url(${img}) ${pos}"><div class="m">${medal(PL)}</div></div>`}
<div class="body blk"><h1>${U.tpl[PL].replace('{n}',U.ord[N-1])}</h1>
<p class="lead">${U.lead}</p>
<ol>${S.map(x=>`<li>${x}</li>`).join('')}</ol>
<p class="gut"><i>${U.gutL}</i> ${G}</p>
<p class="cta">${U.cta[PL]}</p></div>
<div class="foot blk">astrotraderpro.com</div><div class="frame"></div></div>`;
// Adatta il corpo del testo finché l'ultimo paragrafo resta ad almeno 34px dal footer.
window.fit=()=>{const li=[...document.querySelectorAll('li')], h1=document.querySelector('h1'), gt=document.querySelector('.gut'), cta=document.querySelector('.cta'), foot=document.querySelector('.foot');
 const room=()=>foot.getBoundingClientRect().top-34-cta.getBoundingClientRect().bottom;
 const set=(fs)=>{li.forEach(e=>e.style.fontSize=fs+'px'); gt.style.fontSize=Math.round(fs*.94)+'px';};
 let fs=parseFloat(getComputedStyle(li[0]).fontSize), max=fs+1, hs=parseFloat(getComputedStyle(h1).fontSize), g=0;
 // 1) cresce fino a max finché c'è spazio; 2) riduce se sfora; 3) distribuisce lo spazio residuo tra le righe
 while(room()>60&&fs<max&&g++<10){fs+=1;set(fs);} if(room()<0){fs-=1;set(fs);}
 while(room()<0&&g++<60){ if(fs>25){fs-=1;set(fs);} else if(hs>54){hs-=2;h1.style.fontSize=hs+'px';} else break; }
 const pad=parseFloat(getComputedStyle(li[0]).paddingTop), extra=Math.min(12,Math.max(0,Math.floor(room()/(2*li.length))));
 li.forEach(e=>{e.style.paddingTop=e.style.paddingBottom=(pad+extra)+'px'});
 if(room()<0){li.forEach(e=>{e.style.paddingTop=e.style.paddingBottom='10px'});}
};
window.fit();
</script></body></html>
