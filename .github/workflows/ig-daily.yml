name: IG Daily Post
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: ig-daily
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Render cards
        run: node scripts/render.mjs
      - name: Commit cards
        run: |
          git config user.name "atp-bot"
          git config user.email "bot@astrotraderpro.com"
          git add ig/card-feed.png ig/card-story.png
          git commit -m "daily card $(date -u +%F)" || echo "no change"
          git push
          echo "IMG_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish.mjs
