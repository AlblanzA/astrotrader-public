# =====================================================================
#  IG Daily Post — carosello (6 schede), 6 storie, pagina Facebook
# =====================================================================
#
#  MIGRAZIONE 10 set 2026: dal single-card al carosello. Le immagini del
#  giorno (ig/carousel, ig/stories, ig/social.json) sono preparate nel repo
#  PRIVATO (`npm run social-giorno` + stage-social) e spinte qui PRIMA che il
#  cron scatti. Questo workflow VERIFICA e PUBBLICA; se le immagini mancano o
#  sono vecchie, lo dice forte invece di ripubblicare quelle di ieri.
#
#  ── PERCHE' FALLISCE RUMOROSAMENTE ─────────────────────────────────────
#   - la prova a secco gira SEMPRE prima di pubblicare: manifesto vecchio o
#     lessico non passato -> ci si ferma prima di toccare la rete;
#   - `set -euo pipefail` implicito via bash; annotazioni `::error::` in rosso;
#   - `Mark posted` solo su successo, cosi' i cron di backup non ripubblicano.
#
#  NB LinkedIn: il trigger Make e' stato rimosso (la pagina Facebook ora si
#  pubblica direttamente via Graph API). LinkedIn passa al generatore dedicato
#  (studio-ricerca) via un publisher gated su LINKEDIN_TOKEN — da collegare.

name: IG Daily Post
on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 11 * * *'   # backup se GitHub salta le 08:00
    - cron: '0 14 * * *'   # secondo backup
  workflow_dispatch:
permissions:
  contents: write
concurrency: ig-daily
defaults:
  run:
    shell: bash
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Guard - gia' postato oggi?
        id: guard
        run: |
          TODAY=$(date -u +%F)
          LAST=$(cat ig/.posted 2>/dev/null || echo "")
          if [ "$LAST" = "$TODAY" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Gia' postato per $TODAY -> skip (usa Run workflow per forzare)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps
        if: steps.guard.outputs.skip != 'true'
        run: npm install --no-audit --no-fund

      # Card singola (compatibilita'): alimenta ig/feed.json e ig/caption.txt.
      # Non viene piu' pubblicata: il canale ora e' il carosello.
      - name: Render card singola (compat)
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/render.mjs

      # Il gate. Nessuna chiamata parte: legge il manifesto, costruisce gli URL,
      # passa il lessico e stampa la sequenza esatta. Se qualcosa non va, esce
      # con codice != 0 e NON si pubblica.
      - name: Prova a secco (nessuna pubblicazione)
        if: steps.guard.outputs.skip != 'true'
        env:
          ATP_DRY_RUN: '1'
          GH_REPO: ${{ github.repository }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          node scripts/publish.mjs
          node scripts/publish-fb.mjs

      - name: Commit immagini del giorno
        id: commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "atp-bot"
          git config user.email "bot@astrotraderpro.com"
          git add ig/
          git commit -m "daily social $(date -u +%F)" || echo "nessuna modifica da committare"
          git push
          # URL appuntati alla SHA, non a "main": se arriva un altro commit
          # mentre Meta scarica, con "main" scaricherebbe l'immagine sbagliata.
          echo "IMG_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Instagram — carosello e storie
        if: steps.guard.outputs.skip != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish.mjs

      # Niente continue-on-error: una pagina muta e' un guasto, non un dettaglio.
      - name: Facebook — post a piu' immagini e storie
        if: steps.guard.outputs.skip != 'true'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-fb.mjs

      - name: Mark posted
        if: steps.guard.outputs.skip != 'true' && success()
        run: |
          date -u +%F > ig/.posted
          git add ig/.posted
          git commit -m "mark posted $(date -u +%F)" || echo "no change"
          git push || echo "push mark failed (non bloccante)"

      - name: Riepilogo del guasto
        if: failure()
        run: |
          {
            echo "## Pubblicazione quotidiana NON riuscita"
            echo ""
            echo "Data UTC: $(date -u +%F)"
            echo ""
            echo "Cause piu' frequenti:"
            echo "1. **Immagini assenti o vecchie.** \`ig/social.json\` deve portare la"
            echo "   data di oggi con 6 schede + 6 storie, preparate nel repo privato"
            echo "   (\`npm run social-giorno\` + stage-social) e spinte qui."
            echo "2. **Token scaduto.** \`IG_ACCESS_TOKEN\` dura 60 giorni; \`ig-refresh.yml\`"
            echo "   lo rinnova ogni lunedi'. Il token di pagina Facebook va rifatto a mano."
            echo "3. **Quota.** 50 pubblicazioni/24h; la giornata ne costa 7 (1 carosello + 6 storie)."
            echo "4. **Lessico.** Una parola di mercato nella didascalia blocca prima di partire."
            echo ""
            echo "L'errore preciso e' nell'annotazione rossa in cima al run."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
