# =====================================================================
#  IG Daily Post — Instagram: carosello (6 schede) + 6 storie
#                  Facebook + LinkedIn: via Make (come prima)
# =====================================================================
#
#  MIGRAZIONE 10 set 2026: Instagram passa dal single-card al CAROSELLO. Le
#  immagini del giorno (ig/carousel, ig/stories, ig/social.json) sono preparate
#  nel repo PRIVATO (`npm run social-giorno` + stage-social) e spinte qui PRIMA
#  che il cron scatti.
#
#  Facebook e LinkedIn restano su MAKE, esattamente come prima: la pagina non
#  usa la Graph API diretta (nessun FB_PAGE_TOKEN configurato), quindi la card
#  feed.json (render.mjs: testo e copertina del carosello, zero mercati) e Make lo pubblica su FB + LinkedIn.
#  NB: Instagram riceve il carosello; FB/LinkedIn ricevono la card singola via
#  Make. Per portare il carosello anche su FB servirebbero i secret FB Graph e
#  togliere FB dallo scenario Make (evita il doppio-post) — passo futuro.
#
#  ── PERCHE' FALLISCE RUMOROSAMENTE ─────────────────────────────────────
#   - la prova a secco (solo Instagram) gira PRIMA di pubblicare: manifesto
#     vecchio o lessico non passato -> stop prima di toccare la rete;
#   - `Mark posted` solo su successo, cosi' i cron di backup non ripubblicano.

name: IG Daily Post
on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 11 * * *'   # backup se GitHub salta le 08:00
    - cron: '0 14 * * *'   # secondo backup
  workflow_dispatch:
  # Pubblica appena arrivano le immagini del giorno: il repo privato spinge
  # ig/social.json + ig/carousel + ig/stories e il carosello esce da solo.
  push:
    branches: [main]
    paths:
      - 'ig/social.json'
      - 'ig/carousel/**'
      - 'ig/stories/**'
permissions:
  contents: write
concurrency: ig-daily
defaults:
  run:
    shell: bash
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # ref: main (1/10/2026): con workflow_run/schedule il checkout predefinito è il
      # commit dell'evento, che può precedere lo stato salvato dal run appena
      # finito (concorrenza) → doppio post. Si prende sempre l'ultimo main.
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Guard - gia' postato oggi?
        id: guard
        run: |
          TODAY=$(date -u +%F)
          LAST=$(cat ig/.posted 2>/dev/null || echo "")
          if [ "$LAST" = "$TODAY" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Gia' postato per $TODAY (run schedulato) -> skip."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps
        if: steps.guard.outputs.skip != 'true'
        run: npm install --no-audit --no-fund

      # Feed per Make (Facebook + LinkedIn): dal 30/9 porta il testo e la
      # copertina del carosello (ig/social.json), NON piu' la card con i mercati.
      - name: Render card singola (per Make — FB e LinkedIn)
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/render.mjs

      # Il gate, SOLO Instagram. Nessuna chiamata parte: legge il manifesto,
      # costruisce gli URL, passa il lessico e stampa la sequenza. Se qualcosa
      # non va, esce != 0 e NON si pubblica.
      - name: Prova a secco Instagram (nessuna pubblicazione)
        if: steps.guard.outputs.skip != 'true'
        env:
          ATP_DRY_RUN: '1'
          GH_REPO: ${{ github.repository }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/publish.mjs

      - name: Commit immagini del giorno
        id: commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "atp-bot"
          git config user.email "bot@astrotraderpro.com"
          git add ig/
          git commit -m "daily social $(date -u +%F)" || echo "nessuna modifica da committare"
          git pull --rebase
          git push
          # URL appuntati alla SHA, non a "main".
          echo "IMG_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Instagram — carosello e storie
        if: steps.guard.outputs.skip != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish.mjs

      # Facebook diretto (Graph API): il carosello e le storie di pagina.
      # Parte SOLO se esiste il file fb/DIRECT e ci sono i secret FB: il file si
      # aggiunge nello stesso momento in cui si toglie Facebook da Make, cosi'
      # la pagina non riceve mai due post. Un guasto FB non blocca il resto.
      - name: Facebook — post a piu' immagini e storie (diretto)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -f fb/DIRECT ] || [ -z "$FB_PAGE_ID" ] || [ -z "$FB_PAGE_TOKEN" ]; then
            echo "Facebook diretto non attivo (manca fb/DIRECT o i secret): resta Make."
            exit 0
          fi
          node scripts/publish-fb.mjs

      # Facebook + LinkedIn: via Make, esattamente come prima. Riceve data e SHA;
      # legge la card singola dal feed pubblico. continue-on-error: un problema di
      # Make non deve invalidare un carosello Instagram gia' uscito.
      - name: Trigger Make (Facebook + LinkedIn via webhook)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          URL=$(printf '%s' "$MAKE_WEBHOOK_URL" | tr -d '[:space:]')
          if [ -z "$URL" ]; then
            echo "MAKE_WEBHOOK_URL non impostato -> salto il trigger Make."
            exit 0
          fi
          echo "Attendo la propagazione del feed (astrotraderpro.com)..."
          sleep 120
          if curl -sS -X POST "$URL" -H "Content-Type: application/json" -d "{\"date\":\"$(date -u +%F)\",\"ref\":\"${IMG_REF:-main}\"}"; then
            echo ""
            echo "Make avvisato: pubblica la card di oggi su Facebook e LinkedIn."
          else
            echo "ATTENZIONE: chiamata a Make fallita (non blocca il workflow)."
          fi

      - name: Mark posted
        if: steps.guard.outputs.skip != 'true' && success()
        run: |
          date -u +%F > ig/.posted
          git add ig/.posted
          git commit -m "mark posted $(date -u +%F)" || echo "no change"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "push mark non riuscito (tentativo $i), riprovo"; sleep $((i*5))
          done

      - name: Riepilogo del guasto
        if: failure()
        run: |
          {
            echo "## Pubblicazione quotidiana NON riuscita"
            echo ""
            echo "Data UTC: $(date -u +%F)"
            echo ""
            echo "Cause piu' frequenti:"
            echo "1. **Immagini assenti o vecchie.** \`ig/social.json\` deve portare la"
            echo "   data di oggi con 6 schede + 6 storie, preparate nel repo privato"
            echo "   (\`npm run social-giorno\` + stage-social) e spinte qui."
            echo "2. **Token IG scaduto.** \`IG_ACCESS_TOKEN\` dura 60 giorni; \`ig-refresh.yml\`"
            echo "   lo rinnova ogni lunedi'."
            echo "3. **Quota.** 50 pubblicazioni/24h; la giornata ne costa 7 (1 carosello + 6 storie)."
            echo "4. **Lessico.** Una parola di mercato nella didascalia blocca prima di partire."
            echo ""
            echo "L'errore preciso e' nell'annotazione rossa in cima al run."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
