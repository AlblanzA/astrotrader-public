# Controllo del token LinkedIn (sola lettura): chi è l'autore e quali pagine
# aziendali il token può gestire. Non pubblica nulla, non stampa il token.
name: LI Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/li-check.yml']
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Autore e pagine
        env:
          T: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          AUTHOR: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          echo "LINKEDIN_AUTHOR_URN impostato: $([ -n "$AUTHOR" ] && echo si || echo no)"
          echo "== userinfo"; curl -s https://api.linkedin.com/v2/userinfo -H "Authorization: Bearer $T" | jq '{sub, name, error: .message}'
          for V in 202609 202608 202607 202606 202603; do
            R=$(curl -s -o /tmp/o.json -w "%{http_code}" "https://api.linkedin.com/rest/organizationAcls?q=roleAssignee&role=ADMINISTRATOR&state=APPROVED" \
              -H "Authorization: Bearer $T" -H "LinkedIn-Version: $V" -H "X-Restli-Protocol-Version: 2.0.0")
            echo "versione $V -> HTTP $R $(jq -c '{n: (.elements|length), orgs: [.elements[]?.organization], message}' /tmp/o.json)"
          done
