# Controllo del token LinkedIn (sola lettura): chi è l'autore e quali pagine
# aziendali il token può gestire. Non pubblica nulla, non stampa il token.
name: LI Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/li-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Autore e pagine
        env:
          T: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          AUTHOR: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          echo "LINKEDIN_AUTHOR_URN impostato: $([ -n "$AUTHOR" ] && echo si || echo no)"
          echo "== userinfo"; curl -s https://api.linkedin.com/v2/userinfo -H "Authorization: Bearer $T" | jq '{sub, name, error: .message}'
          echo "== pagine gestibili"; curl -s "https://api.linkedin.com/rest/organizationAcls?q=roleAssignee&role=ADMINISTRATOR&state=APPROVED" \
            -H "Authorization: Bearer $T" -H "LinkedIn-Version: 202509" -H "X-Restli-Protocol-Version: 2.0.0" | jq '{n: (.elements|length), orgs: [.elements[]?.organization], status, message}'
          echo "== token"; curl -s -X POST https://www.linkedin.com/oauth/v2/introspectToken -d "token=$T" | jq '{active, scope, expires_at, status, message}' 2>/dev/null || true
