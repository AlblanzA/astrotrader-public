# =====================================================================
#  Auto Retry — rilancia da solo i run falliti per colpa di GitHub
# =====================================================================
#
#  5/10/2026 19:45–20:22Z: IG Series Post e la pubblicazione di Pages sono
#  finiti «failure/cancelled» con «The job was not acquired by Runner of type
#  hosted even after multiple attempts» = guasto dei runner GitHub, non del
#  codice. Rilanciare a mano in quei minuti non serve (nessun runner libero).
#
#  Questo workflow parte quando uno dei workflow di pubblicazione finisce male,
#  aspetta 10 minuti e lo rilancia (al massimo 2 volte per run). È sicuro:
#  gli script leggono lo stato (series-posted.json / .posted) e non
#  pubblicano due volte la stessa voce.
name: Auto Retry
on:
  workflow_run:
    workflows: ['IG Daily Post', 'IG Series Post', 'LinkedIn Series Post']
    types: [completed]
permissions:
  actions: write
  contents: read
jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'startup_failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Rilancio
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          NAME: ${{ github.event.workflow_run.name }}
          CONCL: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -u
          echo "$NAME run $RUN_ID tentativo $ATTEMPT: $CONCL"
          if [ "$ATTEMPT" -ge 3 ]; then
            echo "::error::$NAME fallito $ATTEMPT volte: serve un controllo a mano (run $RUN_ID)"; exit 1
          fi
          # Un run «cancelled» va rilanciato solo se nessun job è partito davvero
          # (guasto runner). Se è stato annullato a mano o dalla concorrenza, no.
          if [ "$CONCL" = "cancelled" ]; then
            partiti=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '[.jobs[] | select(.runner_name != null and .runner_name != "")] | length')
            if [ "$partiti" != "0" ]; then echo "annullato con job già avviati: nessun rilancio"; exit 0; fi
          fi
          sleep 600
          gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs" \
            || gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun"
          echo "rilanciato $NAME (run $RUN_ID)"
