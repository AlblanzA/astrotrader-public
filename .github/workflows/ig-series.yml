# =====================================================================
#  IG Series Post — le serie «pianeti» (A, B, lunazioni)
# =====================================================================
#
#  Si AGGIUNGE a «IG Daily Post» (carosello quotidiano), non lo tocca.
#  Il calendario e le immagini stanno negli asset del Worker:
#    https://astrotraderpro.astrotraderproapp.workers.dev/social/ig/series.json
#  Gira ogni mezz'ora e pubblica al massimo UNA voce per giro (la più vecchia
#  maturata e non ancora uscita), poi ne ripubblica la copertina in storia.
#  Lo stato sta in ig/series-posted.json, committato qui.
#
#  AFFIDABILITÀ (30/9): i cron di GitHub arrivano con ore di ritardo e molti
#  giri vengono saltati (visti 3 giri al giorno invece di 48). Quindi:
#   - finestra di 18 ore per voce (una voce in ritardo esce tardi, non si perde);
#   - il workflow parte anche alla fine di «IG Daily Post» e «LinkedIn Series
#     Post» (più occasioni di giro, senza cicli);
#   - gruppo di concorrenza proprio + push dello stato con 5 tentativi: se lo
#     stato non arriva su GitHub il run diventa rosso (evita doppi post).

name: IG Series Post
on:
  schedule:
    - cron: '5,35 * * * *'
  workflow_run:
    workflows: ['IG Daily Post', 'LinkedIn Series Post']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry:
        description: 'Prova a secco (nessuna pubblicazione)'
        type: boolean
        default: true
      now:
        description: 'Ora simulata ISO (solo per la prova a secco), es. 2026-10-01T17:05:00Z'
        required: false
permissions:
  contents: write
concurrency: ig-series
defaults:
  run:
    shell: bash
jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # ref: main (1/10/2026): con workflow_run/schedule il checkout predefinito è il
      # commit dell'evento, che può precedere lo stato salvato dal run appena
      # finito (concorrenza) → doppio post. Si prende sempre l'ultimo main.
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund

      # Storie 9:16 (1/10/2026): la copertina 4:5 ripubblicata in storia veniva
      # ritagliata ai lati. Si crea ig/story/<id>.jpg per le voci in uscita, si
      # committa e si passa a publish-series.mjs l'indirizzo raw al sha del
      # commit. Se qualcosa va storto si prosegue: la storia userà l'originale.
      - name: Storie 9:16
        id: frames
        continue-on-error: true
        env:
          ATP_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.now || '' }}
          ATP_SERIES_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/ig/series-v2.json
        run: |
          set -uo pipefail
          node scripts/story-frames.mjs
          if [ -n "$(git status --porcelain ig/story 2>/dev/null)" ] && [ "${{ (github.event_name == 'workflow_dispatch' && inputs.dry) && '1' || '0' }}" != "1" ]; then
            git config user.name "atp-bot"
            git config user.email "bot@astrotraderpro.com"
            git add ig/story
            git commit -m "story frames $(date -u +%FT%H:%M)"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              sleep $((i*5))
            done
          fi
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "base=https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Serie — pubblicazione
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ATP_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry) && '1' || '0' }}
          ATP_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.now || '' }}
          ATP_SERIES_LANGS: 'en,hi,es,pt,fr,ru,zh,ja'
          ATP_SERIES_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/ig/series-v2.json
          ATP_STORY_BASE: ${{ steps.frames.outputs.base }}
        run: |
          set -euo pipefail
          # ultimo stato prima di pubblicare (difesa contro i doppioni)
          git pull -q --ff-only origin main || echo "::warning::pull dello stato non riuscito"
          node scripts/publish-series.mjs

      # Facebook: stessa serie sulla pagina (solo EN). Si salta da sola se i
      # secret FB_PAGE_ID / FB_PAGE_TOKEN non ci sono. Un guasto FB non deve
      # invalidare un post Instagram gia' uscito.
      - name: Serie — Facebook
        if: always()
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          ATP_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry) && '1' || '0' }}
          ATP_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.now || '' }}
          ATP_FB_SERIES_LANGS: 'en'
          ATP_SERIES_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/ig/series-v2.json
        run: node scripts/publish-fb-series.mjs

      - name: Salva lo stato
        if: always()
        run: |
          if [ -n "$(git status --porcelain ig/series-posted.json fb/series-posted.json 2>/dev/null)" ]; then
            git config user.name "atp-bot"
            git config user.email "bot@astrotraderpro.com"
            git add ig/series-posted.json
            [ -f fb/series-posted.json ] && git add fb/series-posted.json
            git commit -m "series posted $(date -u +%FT%H:%M)"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              echo "push non riuscito (tentativo $i), riprovo"; sleep $((i*5))
            done
            [ -z "$(git log origin/main..HEAD --oneline)" ] || { echo "::error::stato NON salvato su GitHub: rischio doppio post"; exit 1; }
          else
            echo "stato invariato"
          fi
