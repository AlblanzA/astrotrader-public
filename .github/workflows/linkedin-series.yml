# =====================================================================
#  LinkedIn Series Post — serie a immagini multiple (T, lunazioni, ritratti)
# =====================================================================
#  Si AGGIUNGE al post quotidiano che esce via Make: non lo tocca.
#  Calendario e immagini: https://astrotraderpro.astrotraderproapp.workers.dev/social/li/series.json
#  Strada attiva: secret MAKE_LI_SERIES_WEBHOOK → scenario Make che pubblica
#  la copertina sulla PAGINA AstroTrader Pro. Strada API (LINKEDIN_ACCESS_TOKEN
#  + LINKEDIN_AUTHOR_URN di pagina) solo quando LinkedIn concede il permesso.
name: LinkedIn Series Post
on:
  schedule:
    - cron: '20,50 * * * *'
  workflow_run:
    workflows: ['IG Daily Post']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry:
        description: 'Prova a secco (nessuna pubblicazione)'
        type: boolean
        default: true
      now:
        description: 'Ora simulata ISO per la prova a secco'
        required: false
permissions:
  contents: write
concurrency: li-series
defaults:
  run:
    shell: bash
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # ref: main (1/10/2026): con workflow_run/schedule il checkout predefinito è il
      # commit dell'evento, che può precedere lo stato salvato dal run appena
      # finito (concorrenza) → doppio post. Si prende sempre l'ultimo main.
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Serie LinkedIn — pubblicazione
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          MAKE_LI_SERIES_WEBHOOK: ${{ secrets.MAKE_LI_SERIES_WEBHOOK }}
          ATP_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry) && '1' || '0' }}
          ATP_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.now || '' }}
        run: |
          set -euo pipefail
          if [ "$ATP_DRY_RUN" != "1" ] && [ -z "${LINKEDIN_ACCESS_TOKEN}" ] && [ -z "${MAKE_LI_SERIES_WEBHOOK}" ]; then
            echo "Né LINKEDIN_ACCESS_TOKEN né MAKE_LI_SERIES_WEBHOOK impostati: nessuna pubblicazione."
            exit 0
          fi
          node scripts/publish-linkedin-series.mjs
      - name: Salva lo stato
        if: always()
        run: |
          if [ -n "$(git status --porcelain li/ 2>/dev/null)" ]; then
            git config user.name "atp-bot"
            git config user.email "bot@astrotraderpro.com"
            git add li/
            git commit -m "linkedin series posted $(date -u +%FT%H:%M)"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              echo "push non riuscito (tentativo $i), riprovo"; sleep $((i*5))
            done
            [ -z "$(git log origin/main..HEAD --oneline)" ] || { echo "::error::stato NON salvato su GitHub: rischio doppio post"; exit 1; }
          else
            echo "stato invariato"
          fi
